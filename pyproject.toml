[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "giveradar"
version = "0.1.0"
description = "Python client and CLI for the GiveRadar charity data API: 7.9M+ nonprofits in 100+ countries from official government registries."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "GiveRadar", email = "info@giveradar.com" }]
keywords = ["charity", "nonprofit", "ngo", "api", "client", "cli", "giveradar", "due diligence", "501c3"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
dev = ["pytest>=7", "responses>=0.23"]

[project.urls]
Homepage = "https://giveradar.com/for-developers/"
Documentation = "https://giveradar.com/api/docs/"
"OpenAPI spec" = "https://giveradar.com/api/openapi.yaml"
"MCP server" = "https://giveradar.com/mcp/"
Source = "https://github.com/matt-timmermans/giveradar-python"
Issues = "https://github.com/matt-timmermans/giveradar-python/issues"

[project.scripts]
giveradar = "giveradar.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/giveradar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
