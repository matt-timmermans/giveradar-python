# Publishes to PyPI on a GitHub release. Uses PyPI trusted publishing (no token):
# on pypi.org add a trusted publisher for repo matt-timmermans/giveradar-python,
# workflow publish.yml, environment "pypi".
name: publish
on:
  release:
    types: [published]
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
